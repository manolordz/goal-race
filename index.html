<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goal Race</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f2;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.09);--border-med:rgba(0,0,0,.15);
  --text:#1c1c1a;--muted:#7a7a72;--light:#b0afa8;
  --accent:#2d6a4f;--accent-light:#e8f4ed;
  --danger:#c0392b;--r:10px;--rlg:14px;--rsm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-med);border-radius:4px}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;height:56px;gap:4px}
.nav-brand{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:-.3px;margin-right:16px;color:var(--text);flex-shrink:0}
.nav-tabs{display:flex;align-items:center;flex:1;min-width:0}
.nav-tab{border:none;background:none;padding:0 14px;height:56px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s;margin-bottom:-1px;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.nav-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
.nib{border:1px solid var(--border-med);background:var(--surface);color:var(--text);border-radius:var(--rsm);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .15s;flex-shrink:0}
.nib:hover{background:var(--surface2)}
.nib.primary{background:var(--text);border-color:var(--text);color:white;font-size:22px}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.sync-dot.synced{background:#4ade80}
.sync-dot.syncing{background:#fbbf24;animation:pulse 1s infinite}
.sync-dot.error{background:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-med);background:var(--surface);color:var(--text);border-radius:var(--rsm);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--text);color:white;border-color:var(--text)}
.btn.primary:hover{background:#333}
.btn.danger{color:var(--danger);border-color:rgba(192,57,43,.25)}
.btn.danger:hover{background:rgba(192,57,43,.06)}
.ib{border:none;background:none;color:var(--light);padding:5px 6px;border-radius:var(--rsm);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;transition:all .15s;line-height:1}
.ib:hover{background:var(--surface2);color:var(--text)}
.ib.danger:hover{color:var(--danger);background:rgba(192,57,43,.06)}

/* LAYOUT */
.page{padding:28px;max-width:900px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;letter-spacing:-.3px}
.sec-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--light);margin:28px 0 12px}
.sec-label:first-child{margin-top:0}

/* TOGGLE */
.tog-bar{display:flex;gap:2px;background:var(--surface2);border-radius:var(--rsm);padding:3px}
.tog-btn{border:none;background:none;padding:5px 14px;border-radius:calc(var(--rsm) - 2px);font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s}
.tog-btn.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* RACE */
.race-wrap{display:flex;flex-direction:column;gap:8px}
.track-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.track-row:hover{box-shadow:var(--shadow);border-color:var(--border-med)}
.track-name{width:160px;min-width:160px;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-body{flex:1;display:flex;align-items:center;gap:8px}
.track-cells-wrap{flex:1;position:relative;display:flex;align-items:center;height:32px}
.track-cells{display:flex;gap:3px;width:100%;height:100%;align-items:center}
.track-cell{flex:1;height:24px;border-radius:4px;transition:opacity .3s}
.track-cell.on{opacity:1}
.track-cell.off{opacity:.15}
.track-mover{position:absolute;font-size:22px;top:50%;transform:translateY(-50%);transition:left .6s cubic-bezier(.34,1.56,.64,1);z-index:5;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.track-end{font-size:22px;flex-shrink:0}
.track-pct{font-size:11px;color:var(--muted);width:32px;text-align:right;flex-shrink:0}
.tbadge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em}
.tbadge.archived{background:var(--surface2);color:var(--light)}
.tbadge.done{background:var(--accent-light);color:var(--accent)}
.track-hint{font-size:11px;color:var(--light);opacity:0;transition:opacity .15s;white-space:nowrap;flex-shrink:0}
.track-row:hover .track-hint{opacity:1}
@media(max-width:600px){
  .nav-brand{font-size:17px;margin-right:8px}
  .nav-tab{padding:0 10px;font-size:13px}
  .track-row{flex-direction:column;align-items:stretch;gap:6px;padding:12px 14px}
  .track-name{width:100%;font-size:14px}
  .track-body{width:100%}
  .track-hint{display:none}
  .page{padding:16px}
}

/* GOAL CARDS */
.goal-list{display:flex;flex-direction:column;gap:10px}
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;transition:box-shadow .15s,border-color .3s}
.goal-card:hover{box-shadow:var(--shadow)}
.goal-card.highlighted{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.goal-card.drag-over{border-color:var(--accent);background:var(--accent-light)}
.goal-hdr{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.goal-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,.1)}
.goal-title{font-size:14px;font-weight:500;flex:1}
.goal-meta{font-size:12px;color:var(--muted);flex-shrink:0}
.goal-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.goal-hdr:hover .goal-actions{opacity:1}
.goal-chev{font-size:13px;color:var(--light);transition:transform .2s;flex-shrink:0}
.goal-chev.open{transform:rotate(90deg)}
.drag-handle{color:var(--border-med);cursor:grab;font-size:14px;flex-shrink:0}
.drag-handle:active{cursor:grabbing}

/* TASKS */
.tasks-body{border-top:1px solid var(--border)}
.task-item+.task-item{border-top:1px solid var(--border)}
.task-item.drag-over{background:var(--accent-light)}
.task-hdr{display:flex;align-items:center;gap:0;padding:0;transition:background .1s}
.task-hdr:hover{background:var(--surface2)}
.task-hdr-main{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;padding:9px 8px 9px 34px;min-width:0}
.task-hdr-right{display:flex;align-items:center;gap:2px;padding-right:8px;flex-shrink:0}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-med);appearance:none;-webkit-appearance:none;background:none;cursor:pointer;position:relative;flex-shrink:0;transition:all .15s}
.cb:checked{background:var(--text);border-color:var(--text)}
.cb.auto{background:#aaa;border-color:#aaa}
.cb:checked::after,.cb.auto::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;border:2px solid white;border-left:none;border-top:none;transform:rotate(45deg)}
.task-title{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-prog{font-size:11px;color:var(--muted);background:var(--surface2);padding:1px 7px;border-radius:10px;flex-shrink:0}
.task-chev{font-size:11px;color:var(--light);transition:transform .2s;flex-shrink:0}
.task-chev.open{transform:rotate(90deg)}
.date-chip{font-size:11px;color:var(--muted);background:var(--surface2);padding:1px 7px;border-radius:10px;flex-shrink:0}
.notes-hint{font-size:11px;color:var(--light);font-style:italic;flex-shrink:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* STEPS */
.steps-body{padding:4px 16px 10px 68px;border-top:1px solid var(--border);background:var(--surface2)}
.step-row{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:grab}
.step-row:active{cursor:grabbing}
.step-row.drag-over{background:var(--accent-light);border-radius:4px}
.step-text{font-size:12px;color:#444;flex:1}
.step-text.done{text-decoration:line-through;color:var(--light)}
.step-actions{display:flex;opacity:0;transition:opacity .15s}
.step-row:hover .step-actions{opacity:1}
.add-area{padding:8px 16px 10px 68px}
.add-area.task-add{padding:10px 16px;border-top:1px solid var(--border)}
.add-inline{width:100%;border:none;border-bottom:1px solid var(--border-med);background:none;outline:none;font-size:13px;padding:3px 0;color:var(--text)}
.add-inline::placeholder{color:var(--light)}
.add-inline:focus{border-bottom-color:var(--text)}
.add-trig{display:inline-flex;align-items:center;gap:5px;border:none;background:none;font-size:13px;color:var(--light);cursor:pointer;padding:3px 0;transition:color .15s}
.add-trig:hover{color:var(--text)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--rlg);padding:26px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field textarea{width:100%;border:1px solid var(--border-med);border-radius:var(--rsm);padding:9px 12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--text)}
.field textarea{resize:vertical;min-height:70px}
.type-tog{display:flex;gap:8px}
.type-btn{flex:1;padding:9px;border-radius:var(--rsm);border:1px solid var(--border-med);background:none;cursor:pointer;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s}
.type-btn.active{background:var(--text);color:white;border-color:var(--text);font-weight:500}
.colors-grid{display:flex;flex-wrap:wrap;gap:10px}
.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s}
.color-dot:hover{transform:scale(1.1)}
.color-dot.sel{border-color:var(--text);transform:scale(1.15)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;padding:48px 20px;color:var(--light);font-size:14px}
.empty .emoji{font-size:32px;margin-bottom:10px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--muted);font-size:14px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SURL = 'https://gezkqfvxcwguehsvqtnt.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlemtxZnZ4Y3dndWVoc3ZxdG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4Mjk1OTIsImV4cCI6MjA5MDQwNTU5Mn0.ZC3_hqz2gh9C4pnTyb4foZUAFGx1ksqsPNigsGuQGzA';

async function dbLoad() {
  const { data, error } = await sb.from('goals').select('data').eq('id', ROW).single();
  if (error || !data) return null;
  return data.data;
}
async function dbSave(payload) {
  await sb.from('goals').upsert({ id: ROW, data: payload, updated_at: new Date().toISOString() });
}

const uid = () => Math.random().toString(36).slice(2, 9);
const COLORS = ['#e8e8e4','#94a3b8','#f87171','#fb923c','#fbbf24','#facc15','#a3e635','#4ade80','#2dd4bf','#38bdf8','#60a5fa','#a78bfa','#f472b6','#fb7185'];
const mkStep = (t='') => ({ id:uid(), title:t, done:false, notes:'', date:'' });
const mkTask = (t='') => ({ id:uid(), title:t, manual:false, mun:false, steps:[], open:false, notes:'', date:'' });
const mkGoal = (t='', c='#60a5fa', type='goal') => ({ id:uid(), title:t, color:c, type, tasks:[], open:false, archived:false, notes:'' });

function tDone(t) {
  if (t.mun) return false;
  if (t.manual) return true;
  if (!t.steps.length) return false;
  return t.steps.every(s => s.done);
}
function sProg(t) {
  if (!t.steps.length) return null;
  const d = t.steps.filter(s => s.done).length;
  return { d, total: t.steps.length, pct: Math.round(d / t.steps.length * 100) };
}
function gProg(g) {
  const total = g.tasks.length;
  const d = g.tasks.filter(tDone).length;
  return { d, total, pct: total ? Math.round(d/total*100) : 0 };
}
function gDone(g) { const {d,total}=gProg(g); return total>0&&d===total; }

const DEF = [
  { id:'g1', title:'Move into my own house', color:'#e8e8e4', type:'goal', open:false, archived:false, notes:'', tasks:[
    { id:'t1', title:'Research houses', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Look at houses on Zillow using filters'),mkStep('Make sure houses are not RSO'),mkStep('Shortlist favorite houses'),mkStep('Plan a tour with broker'),mkStep('See houses'),mkStep('Pick favorite')] },
    { id:'t2', title:'Get an offer accepted', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Fill out paperwork'),mkStep('Send offer'),mkStep('Review counter offer'),mkStep('Send final offer')] },
    { id:'t3', title:'Open escrow', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Sign agreement'),mkStep('Pay Earnest Money Deposit')] },
    { id:'t4', title:'Make house inspections', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Schedule general inspection'),mkStep('Schedule sewer inspection'),mkStep('Schedule termites inspection'),mkStep('Pay inspections'),mkStep('Be present at inspections')] },
    { id:'t5', title:'Get appraisal', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Provide all necessary paperwork'),mkStep('Sign contract'),mkStep('Get appraisal')] },

    { id:'t7', title:'Remove all contingencies', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Remove inspection contingency'),mkStep('Remove interest rate contingency'),mkStep('Remove loan contingency')] },
    { id:'t8', title:'Make down payment', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Make sure money needed is available'),mkStep('Deposit remainder of down payment')] },
    { id:'t9', title:'Final touches', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Make necessary improvements after inspections'),mkStep('Negotiate repairs to be made by seller'),mkStep('Make sure all paperwork is done'),mkStep('Get home insurance')] },
    { id:'t10', title:'Move', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Research movers in the area'),mkStep('Get a quote'),mkStep('Schedule movers'),mkStep('Move')] },
  ]},
  { id:'h1', title:'Take Dag to Small Claims', color:'#94a3b8', type:'hurdle', open:false, archived:false, notes:'', tasks:[
    { id:'ht1', title:'File claim', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Fill out small claims form'),mkStep('Pay fee'),mkStep('File paperwork')] },
    { id:'ht2', title:'Serve Dag', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Make sure he is present at address'),mkStep('Have a friend or Sheriff serve the papers')] },
    { id:'ht3', title:'File serving notice', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Have server fill out paperwork'),mkStep('File serving notice (10+ days before court date)')] },
    { id:'ht4', title:'Prepare for court date', manual:false, mun:false, open:false, notes:'', date:'', steps:[mkStep('Prepare for the case'),mkStep('Make a timeline'),mkStep('Print out outstanding evidence')] },
    { id:'ht5', title:'Go to court', manual:false, mun:false, open:false, notes:'', date:'', steps:[] },
    { id:'ht6', title:'Receive judgement', manual:false, mun:false, open:false, notes:'', date:'', steps:[] },
  ]},
];

function loadTpl() { try { return JSON.parse(localStorage.getItem('gr_tpl')||'[]'); } catch(e) { return []; } }

// ── Modals ──────────────────────────────────────────────────────────────────
function GoalModal({ initial, onClose, onSave }) {
  const [title,setTitle] = useState(initial?.title||'');
  const [color,setColor] = useState(initial?.color||'#60a5fa');
  const [type,setType] = useState(initial?.type||'goal');
  const [notes,setNotes] = useState(initial?.notes||'');
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">{initial?'Edit':'New'} {type==='hurdle'?'Hurdle':'Goal'}</div>
        <div className="field"><label>Type</label>
          <div className="type-tog">
            <button className={`type-btn ${type==='goal'?'active':''}`} onClick={()=>setType('goal')}>🎯 Goal</button>
            <button className={`type-btn ${type==='hurdle'?'active':''}`} onClick={()=>setType('hurdle')}>🪨 Hurdle</button>
          </div>
        </div>
        <div className="field"><label>Title</label>
          <input autoFocus value={title} onChange={e=>setTitle(e.target.value)} placeholder={type==='hurdle'?'What is blocking you?':'What do you want to achieve?'} />
        </div>
        {type==='goal' && <div className="field"><label>Track color</label>
          <div className="colors-grid">{COLORS.map(c=><div key={c} className={`color-dot ${color===c?'sel':''}`} style={{background:c}} onClick={()=>setColor(c)}/>)}</div>
        </div>}
        <div className="field"><label>Notes (optional)</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Any context…"/></div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={()=>title.trim()&&onSave({title:title.trim(),color,type,notes})}>{initial?'Save changes':'Create'}</button>
        </div>
      </div>
    </div>
  );
}

function ItemModal({ title:mt, initial, onClose, onSave }) {
  const [title,setTitle] = useState(initial?.title||'');
  const [notes,setNotes] = useState(initial?.notes||'');
  const [date,setDate] = useState(initial?.date||'');
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">{mt}</div>
        <div className="field"><label>Title</label><input autoFocus value={title} onChange={e=>setTitle(e.target.value)}/></div>
        <div className="field"><label>Due date (optional)</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div className="field"><label>Notes (optional)</label><textarea value={notes} onChange={e=>setNotes(e.target.value)}/></div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={()=>title.trim()&&onSave({title:title.trim(),notes,date})}>Save</button>
        </div>
      </div>
    </div>
  );
}

function TplModal({ templates, onClose, onUse, onDelete }) {
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">Templates</div>
        {!templates.length && <p style={{fontSize:14,color:'var(--muted)',marginBottom:16}}>No templates yet. Use 🔖 on any goal to save one.</p>}
        {templates.map(t=>(
          <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
            <div style={{width:14,height:14,borderRadius:'50%',background:t.color,border:'1.5px solid rgba(0,0,0,.1)',flexShrink:0}}/>
            <div style={{flex:1}}><div style={{fontSize:14,fontWeight:500}}>{t.title}</div><div style={{fontSize:12,color:'var(--muted)'}}>{t.tasks.length} tasks</div></div>
            <button className="btn" style={{padding:'5px 12px',fontSize:12}} onClick={()=>onUse(t)}>Use</button>
            <button className="ib danger" onClick={()=>onDelete(t.id)}>🗑</button>
          </div>
        ))}
        <div className="modal-footer"><button className="btn" onClick={onClose}>Close</button></div>
      </div>
    </div>
  );
}

// ── TrackRow ────────────────────────────────────────────────────────────────
function TrackRow({ g, onNav }) {
  const {d,total,pct} = gProg(g);
  const isH = g.type==='hurdle';
  const complete = gDone(g);
  const color = isH ? '#c0bfba' : g.color;
  const mover = isH ? '🪨' : '🐎';
  const ender = isH ? '🗑️' : (complete ? '🏆' : '🏁');
  const prog = total > 0 ? d/total : 0;
  return (
    <div className="track-row" style={{opacity:g.archived?.55:1}} onClick={onNav}>
      <div className="track-name" title={g.title}>{g.title}</div>
      <div className="track-body">
        <div className="track-cells-wrap">
          <div className="track-cells">
            {Array.from({length:Math.max(total,1)}).map((_,i)=><div key={i} className={`track-cell ${i<d?'on':'off'}`} style={{background:color}}/>)}
          </div>
          {total>0 && <div className="track-mover" style={{left:`calc(${prog*100}% - ${prog>0?12:0}px)`}}>{mover}</div>}
        </div>
        <div className="track-end">{ender}</div>
        <div className="track-pct">{pct}%</div>
      </div>
      {g.archived && <span className="tbadge archived">archived</span>}
      {complete && !g.archived && <span className="tbadge done">done!</span>}
      <span className="track-hint">→ tasks</span>
    </div>
  );
}

// ── StepRow ─────────────────────────────────────────────────────────────────
function StepRow({ s, onToggle, onEdit, onDelete, dref, idx, onDrop }) {
  const [over,setOver] = useState(false);
  return (
    <div className={`step-row ${over?'drag-over':''}`} draggable
      onDragStart={()=>{ dref.current=idx; }}
      onDragOver={e=>{ e.preventDefault(); setOver(true); }}
      onDragLeave={()=>setOver(false)}
      onDrop={e=>{ e.preventDefault(); setOver(false); onDrop(idx); }}
    >
      <span className="drag-handle">⠿</span>
      <input type="checkbox" className="cb" checked={s.done} onChange={onToggle} onClick={e=>e.stopPropagation()}/>
      <span className={`step-text ${s.done?'done':''}`}>{s.title}</span>
      {s.date && <span className="date-chip">📅 {s.date}</span>}
      {s.notes && <span className="notes-hint" title={s.notes}>"{s.notes}"</span>}
      <div className="step-actions">
        <button className="ib" onClick={onEdit}>✏️</button>
        <button className="ib danger" onClick={onDelete}>🗑</button>
      </div>
    </div>
  );
}

// ── TaskRow ─────────────────────────────────────────────────────────────────
function TaskRow({ t, ti, onUpdate, onDelete, tdref, onDrop }) {
  const [editStep,setEditStep] = useState(null);
  const [addingStep,setAddingStep] = useState(false);
  const [editSelf,setEditSelf] = useState(false);
  const sdref = useRef(null);
  const [over,setOver] = useState(false);

  const isDone = tDone(t);
  const allSD = t.steps.length>0 && t.steps.every(s=>s.done);
  const cbAuto = allSD && !t.mun && !t.manual;
  const upd = patch => onUpdate(ti, {...t, ...patch});

  const doCheck = e => {
    e.stopPropagation();
    if (!t.steps.length) { upd({manual:!t.manual,mun:false}); return; }
    if (allSD) {
      upd({mun:!t.mun, manual:false});
    } else {
      const newMan = !t.manual;
      // Fix: checking marks all steps done too
      const steps = newMan ? t.steps.map(s=>({...s,done:true})) : t.steps;
      upd({manual:newMan, mun:false, steps});
    }
  };

  const toggleStep = si => {
    const steps = t.steps.map((s,i)=>i===si?{...s,done:!s.done}:s);
    const nowAll = steps.every(s=>s.done);
    upd({steps, mun:nowAll?t.mun:false, manual:false});
  };
  const addStep = title => upd({steps:[...t.steps, mkStep(title)]});
  const updStep = (si,patch) => upd({steps:t.steps.map((s,i)=>i===si?{...s,...patch}:s)});
  const delStep = si => upd({steps:t.steps.filter((_,i)=>i!==si)});
  const reorderStep = toIdx => {
    if (sdref.current===null||sdref.current===toIdx) return;
    const steps=[...t.steps]; const[m]=steps.splice(sdref.current,1); steps.splice(toIdx,0,m);
    upd({steps}); sdref.current=null;
  };

  const prog = sProg(t);

  return (
    <div className={`task-item ${over?'drag-over':''}`} draggable
      onDragStart={e=>{ e.stopPropagation(); tdref.current=ti; }}
      onDragOver={e=>{ e.preventDefault(); setOver(true); }}
      onDragLeave={()=>setOver(false)}
      onDrop={e=>{ e.preventDefault(); setOver(false); onDrop(ti); }}
    >
      <div className="task-hdr">
        <div className="task-hdr-main" onClick={()=>upd({open:!t.open})}>
          <span className={`task-chev ${t.open?'open':''}`}>▶</span>
          <input type="checkbox" className={`cb ${cbAuto?'auto':''}`} checked={isDone}
            onChange={doCheck} onClick={e=>e.stopPropagation()}/>
          <span className={`task-title ${isDone?'done':''}`}>{t.title}</span>
          {prog && <span className="task-prog">{prog.d}/{prog.total} · {prog.pct}%</span>}
          {t.date && <span className="date-chip">📅 {t.date}</span>}
          {t.notes && <span className="notes-hint" title={t.notes}>"{t.notes}"</span>}
        </div>
        <div className="task-hdr-right">
          <button className="ib" onClick={e=>{e.stopPropagation();setEditSelf(true);}}>✏️</button>
          <button className="ib danger" onClick={e=>{e.stopPropagation();onDelete(ti);}}>🗑</button>
          <span className="drag-handle" onClick={e=>e.stopPropagation()}>⠿</span>
        </div>
      </div>
      {t.open && (
        <div className="steps-body">
          {t.steps.map((s,si)=>(
            <StepRow key={s.id} s={s} idx={si} dref={sdref}
              onToggle={()=>toggleStep(si)}
              onEdit={()=>setEditStep({s,si})}
              onDelete={()=>delStep(si)}
              onDrop={reorderStep}
            />
          ))}
          {addingStep ? (
            <div style={{padding:'6px 0'}}>
              <input className="add-inline" autoFocus placeholder="Step title…"
                onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim()){addStep(e.target.value.trim());e.target.value='';setAddingStep(false);}if(e.key==='Escape')setAddingStep(false);}}
                onBlur={e=>{if(e.target.value.trim())addStep(e.target.value.trim());setAddingStep(false);}}/>
            </div>
          ) : <button className="add-trig" style={{marginTop:4}} onClick={()=>setAddingStep(true)}>＋ Add step</button>}
        </div>
      )}
      {editSelf && <ItemModal title="Edit task" initial={t} onClose={()=>setEditSelf(false)} onSave={d=>{upd(d);setEditSelf(false);}}/>}
      {editStep && <ItemModal title="Edit step" initial={editStep.s} onClose={()=>setEditStep(null)} onSave={d=>{updStep(editStep.si,d);setEditStep(null);}}/>}
    </div>
  );
}

// ── GoalCard ─────────────────────────────────────────────────────────────────
function GoalCard({ g, onUpdate, onDelete, onDuplicate, onSaveTpl, onArchive, highlighted, gdref, onDrop }) {
  const [editG,setEditG] = useState(false);
  const [addT,setAddT] = useState(false);
  const tdref = useRef(null);
  const cardRef = useRef(null);
  const [over,setOver] = useState(false);

  useEffect(()=>{ if(highlighted&&cardRef.current) cardRef.current.scrollIntoView({behavior:'smooth',block:'start'}); },[highlighted]);

  const upd = patch => onUpdate({...g,...patch});
  const {d,total,pct} = gProg(g);
  const complete = gDone(g);
  const isH = g.type==='hurdle';

  const updTask = (ti,patch) => { const tasks=g.tasks.map((t,i)=>i===ti?{...t,...patch}:t); upd({tasks}); };
  const delTask = ti => { if(confirm('Delete this task?')) upd({tasks:g.tasks.filter((_,i)=>i!==ti)}); };
  const reorderTask = toIdx => {
    if(tdref.current===null||tdref.current===toIdx) return;
    const tasks=[...g.tasks]; const[m]=tasks.splice(tdref.current,1); tasks.splice(toIdx,0,m);
    upd({tasks}); tdref.current=null;
  };
  const handleAddTask = dd => { const t={...mkTask(dd.title),notes:dd.notes,date:dd.date}; upd({tasks:[...g.tasks,t]}); setAddT(false); };

  return (
    <div ref={cardRef} className={`goal-card ${highlighted?'highlighted':''} ${over?'drag-over':''}`}
      draggable
      onDragStart={e=>{ e.stopPropagation(); gdref.current=g.id; }}
      onDragOver={e=>{ e.preventDefault(); setOver(true); }}
      onDragLeave={()=>setOver(false)}
      onDrop={e=>{ e.preventDefault(); setOver(false); onDrop(g.id); }}
    >
      <div className="goal-hdr" onClick={()=>upd({open:!g.open})}>
        <span className="drag-handle" onClick={e=>e.stopPropagation()}>⠿</span>
        <div className="goal-dot" style={{background:isH?'#c0bfba':g.color}}/>
        <span className="goal-title">{g.title}</span>
        <span className="goal-meta">{d}/{total} · {pct}%</span>
        {complete && <span className="tbadge done" style={{marginRight:4}}>✓ done</span>}
        {g.archived && <span className="tbadge archived" style={{marginRight:4}}>archived</span>}
        <div className="goal-actions" onClick={e=>e.stopPropagation()}>
          <button className="ib" title="Edit" onClick={()=>setEditG(true)}>✏️</button>
          <button className="ib" title="Duplicate" onClick={()=>onDuplicate(g)}>⧉</button>
          <button className="ib" title="Save as template" onClick={()=>onSaveTpl(g)}>🔖</button>
          <button className="ib" title={g.archived?'Unarchive':'Archive'} onClick={()=>onArchive(g.id)}>{g.archived?'📤':'📦'}</button>
          <button className="ib danger" title="Delete" onClick={()=>onDelete(g.id)}>🗑</button>
        </div>
        <span className={`goal-chev ${g.open?'open':''}`}>▶</span>
      </div>
      {g.open && (
        <div className="tasks-body">
          {!g.tasks.length && <div style={{padding:'14px 16px',fontSize:13,color:'var(--muted)'}}>No tasks yet.</div>}
          {g.tasks.map((t,ti)=>(
            <TaskRow key={t.id} t={t} ti={ti} onUpdate={updTask} onDelete={delTask} tdref={tdref} onDrop={reorderTask}/>
          ))}
          <div className="add-area task-add">
            <button className="add-trig" onClick={()=>setAddT(true)}>＋ Add task</button>
          </div>
        </div>
      )}
      {editG && <GoalModal initial={g} onClose={()=>setEditG(false)} onSave={d=>{upd(d);setEditG(false);}}/>}
      {addT && <ItemModal title="New task" onClose={()=>setAddT(false)} onSave={handleAddTask}/>}
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab] = useState('race');
  const [data,setData] = useState(null);
  const [tpls,setTpls] = useState(loadTpl);
  const [newG,setNewG] = useState(false);
  const [showTpl,setShowTpl] = useState(false);
  const [filter,setFilter] = useState('active');
  const [hlId,setHlId] = useState(null);
  const [sync,setSync] = useState('synced');
  const saveTimer = useRef(null);
  const latest = useRef(null);
  const gdref = useRef(null);

  useEffect(()=>{
    dbLoad().then(remote=>{
      setData(remote && Array.isArray(remote) ? remote : JSON.parse(JSON.stringify(DEF)));
    }).catch(()=>{
      setData(JSON.parse(JSON.stringify(DEF)));
      setSync('error');
    });
  },[]);

  const save = useCallback(nd=>{
    latest.current = nd;
    setSync('syncing');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async()=>{
      try { await dbSave(latest.current); setSync('synced'); }
      catch(e) { setSync('error'); }
    }, 600);
  },[]);

  const setD = useCallback(upd=>{
    setData(prev=>{
      const next = typeof upd==='function' ? upd(prev) : upd;
      save(next);
      return next;
    });
  },[save]);

  useEffect(()=>{ try{localStorage.setItem('gr_tpl',JSON.stringify(tpls));}catch(e){} },[tpls]);

  useEffect(()=>{
    if (!hlId) return;
    const t = setTimeout(()=>setHlId(null), 1800);
    return ()=>clearTimeout(t);
  },[hlId]);

  const navToGoal = g => {
    setD(prev=>prev.map(x=>x.id===g.id?{...x,open:true}:x));
    setHlId(g.id); setTab('tasks');
  };

  const reorderGoals = toId => {
    if (!gdref.current || gdref.current===toId) return;
    setD(prev=>{
      const next=[...prev];
      const fi=next.findIndex(g=>g.id===gdref.current);
      const ti=next.findIndex(g=>g.id===toId);
      if(fi<0||ti<0) return prev;
      const[m]=next.splice(fi,1); next.splice(ti,0,m);
      return next;
    });
    gdref.current=null;
  };

  const addGoal = dd => { setD(prev=>[...prev,{...mkGoal(dd.title,dd.color,dd.type),notes:dd.notes}]); setNewG(false); };
  const updGoal = ug => setD(prev=>prev.map(g=>g.id===ug.id?ug:g));
  const delGoal = id => { if(confirm('Delete this goal?')) setD(prev=>prev.filter(g=>g.id!==id)); };
  const dupGoal = g => {
    const c={...g,id:uid(),title:g.title+' (copy)',archived:false,tasks:g.tasks.map(t=>({...t,id:uid(),manual:false,mun:false,steps:t.steps.map(s=>({...s,id:uid(),done:false}))}))};
    setD(prev=>[...prev,c]);
  };
  const saveTpl = g => {
    const tmpl={...g,id:uid(),tasks:g.tasks.map(t=>({...t,id:uid(),manual:false,mun:false,steps:t.steps.map(s=>({...s,id:uid(),done:false}))}))};
    setTpls(prev=>[...prev,tmpl]); alert('Saved as template! ✅');
  };
  const useTpl = tmpl => {
    const g={...tmpl,id:uid(),title:tmpl.title+' (copy)',archived:false,tasks:tmpl.tasks.map(t=>({...t,id:uid(),manual:false,mun:false,steps:t.steps.map(s=>({...s,id:uid(),done:false}))}))};
    setD(prev=>[...prev,g]); setShowTpl(false);
  };
  const archiveGoal = id => setD(prev=>prev.map(g=>g.id===id?{...g,archived:!g.archived}:g));

  if (data===null) return <div className="loading"><div className="spinner"/><span>Loading your goals…</span></div>;

  const goals = data.filter(g=>g.type==='goal');
  const hurdles = data.filter(g=>g.type==='hurdle');
  const filterList = list => {
    if (filter==='active') return list.filter(g=>!g.archived&&!gDone(g));
    if (filter==='completed') return list.filter(g=>gDone(g)||g.archived);
    return list;
  };
  const syncLabel = sync==='syncing'?'Saving…':sync==='error'?'Sync error':'Saved';

  return (
    <div>
      <nav className="nav">
        <div className="nav-brand">🐎 Goal Race</div>
        <div className="nav-tabs">
          <button className={`nav-tab ${tab==='race'?'active':''}`} onClick={()=>setTab('race')}>The Race</button>
          <button className={`nav-tab ${tab==='tasks'?'active':''}`} onClick={()=>setTab('tasks')}>Goal Tasks</button>
        </div>
        <div className="nav-right">
          <div className={`sync-dot ${sync}`} title={syncLabel}/>
          <button className="nib" onClick={()=>setShowTpl(true)} title="Templates">🔖</button>
          <button className="nib primary" onClick={()=>setNewG(true)} title="New goal">＋</button>
        </div>
      </nav>

      {tab==='race' && (
        <div className="page">
          <div className="page-header">
            <div className="page-title">The Race</div>
            <div className="tog-bar">
              {[['active','Active'],['completed','Completed'],['all','All']].map(([v,l])=>(
                <button key={v} className={`tog-btn ${filter===v?'active':''}`} onClick={()=>setFilter(v)}>{l}</button>
              ))}
            </div>
          </div>
          <div className="sec-label">Goals</div>
          <div className="race-wrap">
            {!filterList(goals).length && <div className="empty"><div className="emoji">🎯</div>No goals to show here.</div>}
            {filterList(goals).map(g=><TrackRow key={g.id} g={g} onNav={()=>navToGoal(g)}/>)}
          </div>
          {filterList(hurdles).length>0 && <>
            <div className="sec-label">Hurdles</div>
            <div className="race-wrap">{filterList(hurdles).map(g=><TrackRow key={g.id} g={g} onNav={()=>navToGoal(g)}/>)}</div>
          </>}
        </div>
      )}

      {tab==='tasks' && (
        <div className="page">
          <div className="page-header">
            <div className="page-title">Goal Tasks</div>
            <span style={{fontSize:13,color:'var(--muted)'}}>{data.length} total</span>
          </div>
          {goals.length>0 && <>
            <div className="sec-label">Goals</div>
            <div className="goal-list" style={{marginBottom:hurdles.length>0?32:0}}>
              {goals.map(g=><GoalCard key={g.id} g={g} onUpdate={updGoal} onDelete={delGoal} onDuplicate={dupGoal} onSaveTpl={saveTpl} onArchive={archiveGoal} highlighted={hlId===g.id} gdref={gdref} onDrop={reorderGoals}/>)}
            </div>
          </>}
          {hurdles.length>0 && <>
            <div className="sec-label">Hurdles</div>
            <div className="goal-list">
              {hurdles.map(g=><GoalCard key={g.id} g={g} onUpdate={updGoal} onDelete={delGoal} onDuplicate={dupGoal} onSaveTpl={saveTpl} onArchive={archiveGoal} highlighted={hlId===g.id} gdref={gdref} onDrop={reorderGoals}/>)}
            </div>
          </>}
          {!data.length && <div className="empty"><div className="emoji">🚀</div>No goals yet. Hit ＋ to get started!</div>}
        </div>
      )}

      {newG && <GoalModal onClose={()=>setNewG(false)} onSave={addGoal}/>}
      {showTpl && <TplModal templates={tpls} onClose={()=>setShowTpl(false)} onUse={useTpl} onDelete={id=>setTpls(prev=>prev.filter(t=>t.id!==id))}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
